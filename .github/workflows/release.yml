name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build & Draft Release (macOS Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate tag, mygo.json version, and CHANGELOG.md
        run: |
          version="$(jq -r '.version // empty' mygo.json)"
          if [ -z "$version" ]; then
            echo "::error::version is missing in mygo.json"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match expected 'v$version' from mygo.json"
            exit 1
          fi
          github_repo="$(jq -r '.updates.github // empty' mygo.json)"
          public_key="$(jq -r '.updates.publicKey // empty' mygo.json)"
          if [ -z "$github_repo" ] || [ -z "$public_key" ]; then
            echo "::error::updates.github and updates.publicKey must be configured in mygo.json"
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::Missing CHANGELOG.md"
            exit 1
          fi
          notes="$(
            awk -v ver="$version" '
              BEGIN { in_section = 0; found = 0 }
              /^## / {
                if (in_section) exit
                line = substr($0, 4)
                gsub(/^[[:space:]]+/, "", line)
                split(line, fields, /[[:space:]]+/)
                head = fields[1]
                if (substr(head, 1, 1) == "[") {
                  sub(/^\[/, "", head)
                  sub(/\].*$/, "", head)
                }
                sub(/^v/, "", head)
                if (head == ver) { in_section = 1; found = 1 }
                next
              }
              in_section && $0 ~ /[^[:space:]]/ { print $0 }
              END { if (!found) exit 2 }
            ' CHANGELOG.md
          )" || {
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          }
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md section '## $version' is empty"
            exit 1
          fi
          echo "Release metadata verified: tag=$GITHUB_REF_NAME version=$version"

      - name: Check existing GitHub Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_json="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published. Fix issues with a new version and tag instead of overwriting published assets."
              exit 1
            fi
            echo "Draft release $GITHUB_REF_NAME already exists; retrying build and upload."
          else
            echo "Release $GITHUB_REF_NAME does not exist yet; mygo build -upload will create a draft."
          fi

      - name: Run test suite and static checks
        run: |
          go test ./...
          go test -count=5 ./frontend -run 'TestUpdaterSettingsAndHostIntegration|TestUpdateStateChangeDoesNotWaitForStoreLock|TestPrepareCloseBlocksInvalidDraftAndAllowsSaveThenClose|TestPrepareCloseWithActiveBackupOrAttachmentTask'
          go vet ./...
          go tool mygo vet .

      - name: Verify required release secrets
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Missing MYGO_UPDATER_PRIVATE_KEY secret."
            exit 1
          fi
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Missing MACOS_CERTIFICATE or MACOS_CERTIFICATE_PASSWORD secret."
            exit 1
          fi
          has_apple_id=0
          has_api_key=0
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            has_apple_id=1
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            has_api_key=1
          fi
          if [ "$has_apple_id" -eq 0 ] && [ "$has_api_key" -eq 0 ]; then
            echo "::error::Missing Apple notarization credentials (APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD, or APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER)."
            exit 1
          fi

      - name: Import Developer ID certificate and notary credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          p12_path="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$p12_path"
          security import "$p12_path" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_path"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          signing_identity="${MACOS_SIGNING_IDENTITY:-}"
          if [ -z "$signing_identity" ]; then
            signing_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \([^"]*\)".*/Developer ID Application: \1/p' | head -n 1)"
          fi
          if [ -z "$signing_identity" ]; then
            echo "::error::No Developer ID Application signing identity found in imported certificate (or set MACOS_SIGNING_IDENTITY)."
            exit 1
          fi

          if [ -n "$APPLE_API_KEY" ]; then
            api_key_path="$RUNNER_TEMP/AuthKey.p8"
            if printf '%s' "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$APPLE_API_KEY" > "$api_key_path"
            else
              printf '%s' "$APPLE_API_KEY" | base64 --decode > "$api_key_path"
            fi
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            rm -f "$api_key_path"
          else
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          fi

          cp mygo.json "$RUNNER_TEMP/mygo.json.bak"
          jq --arg id "$signing_identity" --arg kc "$keychain" \
            '.macos = ((.macos // {}) + {signingIdentity: $id, notarize: {keychainProfile: "notary", keychain: $kc}})' \
            "$RUNNER_TEMP/mygo.json.bak" > mygo.json

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/universal -upload

      - name: Verify artifacts, checksums, codesign, notarization, and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          manifest="build/darwin-universal/update-darwin-universal.json"
          test -f "$manifest"
          test "$(jq -r .version "$manifest")" = "$version"

          (cd build/darwin-universal && shasum -a 256 -c ../SHA256SUMS)
          codesign --verify --deep --strict --verbose=2 "build/darwin-universal/Aion.app"
          spctl --assess --type exec --verbose=4 "build/darwin-universal/Aion.app"

          for dmg in build/darwin-universal/*.dmg; do
            test -f "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

          release_info="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          printf '%s\n' "$release_info" | jq '{isDraft, assets: [.assets[].name]}'
          test "$(printf '%s' "$release_info" | jq -r '.isDraft')" = "true"
          for required in "aion-${version}.dmg" "aion-${version}-darwin-universal.tar.gz" "update-darwin-universal.json" "SHA256SUMS" "install.sh"; do
            if ! printf '%s' "$release_info" | jq -e --arg n "$required" '.assets[] | select(.name == $n)' >/dev/null; then
              echo "::error::Draft release is missing expected asset: $required"
              exit 1
            fi
          done

      - name: Cleanup temporary certificates, keychain, and build config
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mygo.json.bak" ]; then
            mv "$RUNNER_TEMP/mygo.json.bak" mygo.json
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          security list-keychains -d user -s login.keychain || true
